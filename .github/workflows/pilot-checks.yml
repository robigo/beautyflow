# Checks pull requests targeting beautyflow-v1 and pushes to that branch.
name: Pilot API checks
on:
  pull_request:
    branches:
      - beautyflow-v1
  push:
    branches:
      - beautyflow-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: beautyflow_ci
          POSTGRES_USER: beautyflow_ci
          POSTGRES_PASSWORD: beautyflow_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beautyflow_ci -d beautyflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://beautyflow_ci:beautyflow_ci_only@127.0.0.1:5432/beautyflow_ci
      JWT_SECRET: disposable-ci-secret-not-for-production
      CLIENT_ORIGIN: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Check local test database before migration
        run: node --input-type=module -e "const u = new URL(process.env.DATABASE_URL); if (u.hostname !== '127.0.0.1' || u.pathname !== '/beautyflow_ci') process.exit(1)"
      - name: Set up disposable CI database
        run: pnpm run db:migrate
      - name: Exercise pilot API flows
        run: node --test test/pilot.test.mjs

      - name: Install isolated browser test tools
        run: npm ci --prefix test/browser --ignore-scripts
      - name: Install Chromium
        run: test/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Check UI prices and public booking
        run: npm test --prefix test/browser
      - name: Validate isolated pilot Compose
        working-directory: ${{ github.workspace }}
        env:
          PILOT_DB_PASSWORD: ci_only_hex_password_12345678901234567890
          PILOT_JWT_SECRET: ci_only_jwt_secret_12345678901234567890
        run: docker compose -f deploy/pilot/compose.yaml config -q
      - name: Build isolated pilot container
        working-directory: ${{ github.workspace }}
        run: docker build -f deploy/pilot/Dockerfile -t beautyflow-pilot:ci .
      - name: Boot and smoke-test isolated pilot stack
        working-directory: ${{ github.workspace }}
        env:
          PILOT_DB_PASSWORD: ci_only_hex_password_12345678901234567890
          PILOT_JWT_SECRET: ci_only_jwt_secret_12345678901234567890
        run: |
          trap 'docker compose -f deploy/pilot/compose.yaml down' EXIT
          docker compose -f deploy/pilot/compose.yaml up -d --build
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health | grep -q '"ok":true'; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:8080/ -o /tmp/beautyflow-pilot-index.html
          curl -fsS http://127.0.0.1:8080/booking.html -o /tmp/beautyflow-pilot-booking.html
          if grep -E 'beautyflow-ihl7.vercel.app|cykgkqkmdeimfsnybuqg.supabase.co' /tmp/beautyflow-pilot-index.html /tmp/beautyflow-pilot-booking.html; then exit 1; fi
          node deploy/pilot/smoke-browser.mjs
      - name: Upload browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-browser-failure
          path: server/test/browser/artifacts/
          if-no-files-found: ignore
          retention-days: 7
