services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    command: sleep infinity
    working_dir: /workspaces/beautyflow
    volumes:
      - .:/workspaces/beautyflow:cached
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beautyflow
      POSTGRES_USER: beautyflow
      POSTGRES_PASSWORD: beautyflow_dev_only
    ports:
      - "5432:5432"
    volumes:
      - beautyflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beautyflow -d beautyflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  beautyflow-postgres:
