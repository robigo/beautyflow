<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BeautyFlow</title><style>
:root{--ink:#392a34;--pink:#d85f91;--line:#f0dfe6;--bg:#fff8fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px Arial;color:var(--ink)}button,input,select{font:inherit}button{border:0;border-radius:9px;padding:10px 14px;font-weight:bold;cursor:pointer}.primary{background:var(--pink);color:white}.secondary{background:#ffe4ef;color:#a33f69}.hide{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#fff0f6,#f8d8e6)}.box,.card{background:white;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px #54243d12}.box{width:min(430px,100%);padding:28px}.box h1{text-align:center;margin:0}.field{display:grid;gap:6px;margin:12px 0;font-weight:bold;font-size:13px}.field input,.field select{border:1px solid #e8d6de;border-radius:9px;padding:10px;background:white}.error{color:#c84059;min-height:20px}.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{background:#342631;color:white;padding:25px 14px}.side h2{margin:0 8px 26px}.side button{width:100%;background:transparent;color:#ecdfe5;text-align:right;margin:2px 0}.side button.active,.side button:hover{background:#583e50;color:white}.main{padding:30px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.card{padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.kpi{padding:18px}.kpi b{display:block;font-size:28px;margin-top:8px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:right;border-bottom:1px solid var(--line)}th{color:#b94272;background:#fff6f9}.muted{color:#85727d}.actions{display:flex;gap:8px;align-items:center}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.hours{display:grid;gap:7px}.hour{display:grid;grid-template-columns:100px 1fr 1fr 60px;gap:8px;align-items:center}@media(max-width:750px){.app{display:block}.side{display:flex;gap:4px;overflow:auto;padding:10px}.side h2{display:none}.side button{white-space:nowrap;width:auto}.main{padding:18px}.grid,.form{grid-template-columns:1fr}.full{grid-column:auto}.hour{grid-template-columns:70px 1fr 1fr 55px}}
</style></head><body>
<section class="auth" id="auth"><div class="box"><h1>BeautyFlow</h1><p class="muted">התחברות לממשק העסק</p><form id="login"><label class="field">אימייל<input id="email" type="email" required></label><label class="field">סיסמה<input id="password" type="password" required></label><button class="primary" style="width:100%">התחברות</button></form><div class="error" id="error"></div></div></section>
<section class="app hide" id="app"><aside class="side"><h2 id="brand">BeautyFlow</h2><button data-page="dashboard">◇ דשבורד</button><button data-page="appointments">▣ יומן תורים</button><button data-page="book">＋ קביעת תור</button><button data-page="clients">♟ לקוחות</button><button data-page="settings">⚙ הגדרות</button><button id="platform" class="hide">◉ ניהול פלטפורמה</button><button id="logout">יציאה</button></aside><main class="main"><div class="top"><div><h1 id="title">דשבורד</h1><p class="muted" id="subtitle"></p></div><select id="business"></select></div><div id="content"></div></main></section>
<script>
const API='https://beautyflow-ihl7.vercel.app',KEY='beautyflow-api-token-v1',ACTIVE='beautyflow-active-business-v1';let token=localStorage.getItem(KEY),businesses=[],active='',workspace=null,page='dashboard',admin=false;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(path,{method='GET',body,auth=true}={})=>{const r=await fetch(API+path,{method,headers:{'Content-Type':'application/json',...(auth?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'הפעולה נכשלה');return d};
const date=v=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(v)),time=v=>new Intl.DateTimeFormat('he-IL',{timeZone:'Asia/Jerusalem',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(v));
async function load(){businesses=await api('/api/businesses');active=businesses.find(b=>b.id===localStorage.getItem(ACTIVE))?.id||businesses[0]?.id;if(!active)throw Error('לא נמצא עסק לחשבון זה');localStorage.setItem(ACTIVE,active);workspace=await api(`/api/businesses/${active}/workspace`);$('#brand').textContent=workspace.business.name;$('#business').innerHTML=businesses.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('');$('#business').value=active;$('#auth').classList.add('hide');$('#app').classList.remove('hide');render()}
function clients(){const m=new Map();(workspace.customers||[]).forEach(c=>m.set(c.id,{name:c.full_name,phone:c.phone,visits:0}));(workspace.appointments||[]).forEach(a=>{const x=m.get(a.customer_id)||{name:a.customer_name,phone:a.phone,visits:0};x.visits++;m.set(a.customer_id||a.phone,x)});return [...m.values()]}
function render(){const c=$('#content'),apps=workspace.appointments||[];$('#title').textContent=({dashboard:'דשבורד',appointments:'יומן תורים',book:'קביעת תור',clients:'לקוחות',settings:'הגדרות'})[page];$('#subtitle').textContent=workspace.business.name;if(page==='dashboard'){c.innerHTML=`<div class="grid"><div class="card kpi">תורים<b>${apps.length}</b></div><div class="card kpi">לקוחות<b>${clients().length}</b></div><div class="card kpi">שירותים<b>${(workspace.services||[]).length}</b></div></div>`}if(page==='appointments'){c.innerHTML=`<div class="card"><table><thead><tr><th>תאריך ושעה</th><th>לקוח</th><th>שירות</th><th>מחיר</th><th>סטטוס</th></tr></thead><tbody>${apps.map(a=>`<tr><td>${date(a.starts_at)} · ${time(a.starts_at)}</td><td>${esc(a.customer_name)}<br><small>${esc(a.phone)}</small></td><td>${esc(a.service_name)}</td><td>₪${a.price}</td><td>${esc(a.status)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">אין תורים עדיין</td></tr>'}</tbody></table></div>`}if(page==='clients'){c.innerHTML=`<div class="card"><table><thead><tr><th>שם</th><th>טלפון</th><th>ביקורים</th></tr></thead><tbody>${clients().map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${x.visits}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">אין לקוחות עדיין</td></tr>'}</tbody></table></div>`}if(page==='book'){const services=(workspace.services||[]).map(s=>`<option value="${s.id}" data-price="${s.price}">${esc(s.name)}</option>`).join(''),resources=(workspace.resources||[]).map(r=>`<option value="${r.id}">${esc(r.name)} · ${esc(r.resourceType)}</option>`).join('');c.innerHTML=`<form class="card form" id="bookForm"><label class="field">שם<input id="name" required></label><label class="field">טלפון<input id="phone" required></label><label class="field">שירות<select id="service" required>${services}</select></label><label class="field">משאב<select id="resource" required>${resources}</select></label><label class="field">תאריך<input id="when" type="date" required min="${date(new Date())}"></label><label class="field">שעה<input id="at" type="time" required></label><button class="primary full">שמירת פגישה</button></form>`;$('#bookForm').onsubmit=saveAppointment}if(page==='settings'){const days=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];c.innerHTML=`<div class="card"><h2>שעות פתיחה</h2><form id="hours" class="hours">${days.map((n,i)=>{const h=(workspace.businessHours||[]).find(x=>x.dayOfWeek===i)||{isClosed:true,opensAt:'09:00',closesAt:'17:00'};return `<div class="hour" data-day="${i}"><b>${n}</b><input type="time" value="${String(h.opensAt||'09:00').slice(0,5)}"><input type="time" value="${String(h.closesAt||'17:00').slice(0,5)}"><label><input type="checkbox" ${h.isClosed?'checked':''}> סגור</label></div>`}).join('')}<button class="primary">שמירה</button></form></div><div class="card"><h2>משאבים</h2>${(workspace.resources||[]).map(r=>`<div class="row"><span>${esc(r.name)} · ${esc(r.resourceType)}</span><b>${r.capacity}</b></div>`).join('')}<form id="resourceForm" class="form"><input id="rname" placeholder="שם משאב" required><input id="rtype" placeholder="סוג" value="איש צוות" required><button class="primary">הוספת משאב</button></form></div>`;$('#hours').onsubmit=saveHours;$('#resourceForm').onsubmit=saveResource}}
async function saveAppointment(e){e.preventDefault();try{const s=$('#service'),startsAt=new Date(`${$('#when').value}T${$('#at').value}:00+03:00`).toISOString();await api(`/api/businesses/${active}/appointments`,{method:'POST',body:{customerName:$('#name').value.trim(),phone:$('#phone').value.trim(),serviceId:s.value,resourceId:$('#resource').value,startsAt,status:'מאושר'}});await load();page='appointments';render();alert('הפגישה נשמרה.')}catch(x){alert(x.message)}}
async function saveHours(e){e.preventDefault();try{const rows=[...document.querySelectorAll('[data-day]')].map(r=>({dayOfWeek:+r.dataset.day,opensAt:r.querySelectorAll('input')[0].value,closesAt:r.querySelectorAll('input')[1].value,isClosed:r.querySelector('input[type=checkbox]').checked}));await api(`/api/businesses/${active}/hours`,{method:'PUT',body:rows});await load();alert('השעות נשמרו.')}catch(x){alert(x.message)}}
async function saveResource(e){e.preventDefault();try{await api(`/api/businesses/${active}/resources`,{method:'POST',body:{name:$('#rname').value.trim(),resourceType:$('#rtype').value.trim(),capacity:1}});await load();page='settings';render()}catch(x){alert(x.message)}}
$('#login').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/auth/login',{method:'POST',auth:false,body:{email:$('#email').value.trim(),password:$('#password').value}});token=d.token;localStorage.setItem(KEY,token);admin=!!d.user.isPlatformAdmin;await load()}catch(x){$('#error').textContent=x.message}};$('#business').onchange=async e=>{active=e.target.value;localStorage.setItem(ACTIVE,active);workspace=await api(`/api/businesses/${active}/workspace`);render()};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$('#logout').onclick=()=>{localStorage.removeItem(KEY);location.reload()};if(token)load().catch(()=>{localStorage.removeItem(KEY);token=null});
</script></body></html>
