<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>איפוס סיסמה | BeautyFlow</title>
  <style>
    :root{font:16px/1.6 Arial,sans-serif;color:#392a34;background:#fce8f0}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px}
    main{width:min(430px,100%);padding:30px;background:#fff;border:1px solid #f0dfe6;border-radius:20px;box-shadow:0 20px 65px #64284624}
    h1{font-size:28px;margin:0}p{color:#85727d}form{display:grid;gap:10px}label{font-weight:bold}
    input,button{font:inherit;border-radius:9px;padding:11px}input{width:100%;border:1px solid #e8d6de}
    input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #b94272;outline-offset:3px}
    button{background:#cf588b;color:#fff;border:0;cursor:pointer;font-weight:bold;margin-top:12px}
    button:disabled{opacity:.6;cursor:wait}a{color:#b94272}#status{min-height:26px;margin:16px 0;overflow-wrap:anywhere}
    #status.error{color:#b32443}.hidden{display:none}
  </style>
</head>
<body>
<main>
  <h1>BeautyFlow</h1>
  <h2 id="heading">שכחתי סיסמה</h2>
  <p id="description">הזינו את כתובת האימייל של החשבון ונשלח אליה קישור לאיפוס הסיסמה.</p>
  <form id="forgotForm">
    <label for="email">אימייל</label>
    <input id="email" type="email" autocomplete="email" maxlength="254" required dir="ltr">
    <button type="submit">שליחת קישור לאיפוס</button>
  </form>
  <form id="resetForm" class="hidden">
    <label for="password">סיסמה חדשה</label>
    <input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required aria-describedby="passwordHelp">
    <small id="passwordHelp">בין 8 ל־128 תווים</small>
    <label for="confirm">אימות סיסמה חדשה</label>
    <input id="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
    <button type="submit">שמירת הסיסמה החדשה</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <p><a id="requestAgain" class="hidden" href="reset-password.html">בקשת קישור חדש</a></p>
  <a href="./">חזרה להתחברות</a>
</main>
<script>
(()=>{
  const API_BASE='https://beautyflow-ihl7.vercel.app';
  // The token stays in memory: never in query strings, storage, or referrers.
  let token=new URLSearchParams(location.hash.slice(1)).get('token')||'';
  const hadFragment=Boolean(location.hash);
  history.replaceState(null,'',location.pathname);
  const pick=id=>document.getElementById(id);
  const status=(message,error=false)=>{pick('status').textContent=message;pick('status').classList.toggle('error',error)};
  const request=async(path,body)=>{
    const response=await fetch(API_BASE+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(20000)});
    const result=await response.json().catch(()=>({}));
    if(!response.ok)throw Object.assign(new Error(result.error||'לא ניתן להשלים את הבקשה כרגע.'),{status:response.status});
    return result;
  };
  const linkError=()=>{pick('resetForm').classList.add('hidden');pick('requestAgain').classList.remove('hidden');status('הקישור אינו תקין או שפג תוקפו. יש לבקש קישור חדש.',true)};
  if(hadFragment){
    pick('forgotForm').classList.add('hidden');
    pick('heading').textContent='הגדרת סיסמה חדשה';
    pick('description').textContent='בחרו סיסמה חדשה לחשבון שלכם.';
    if(/^[a-f0-9]{64}$/.test(token)){pick('resetForm').classList.remove('hidden');pick('password').focus()}else linkError();
  }
  pick('forgotForm').addEventListener('submit',async event=>{
    event.preventDefault();
    const button=event.target.querySelector('button');button.disabled=true;status('שולח בקשה…');
    try{const result=await request('/api/auth/forgot-password',{email:pick('email').value.trim()});status(result.message);pick('description').textContent='אם המייל לא הגיע, בדקו גם בתיקיית דואר הזבל.'}
    catch(error){status(error.status?error.message:'לא ניתן להתחבר לשרת. נסו שוב.',true)}
    finally{button.disabled=false}
  });
  pick('confirm').addEventListener('input',()=>pick('confirm').setCustomValidity(''));
  pick('resetForm').addEventListener('submit',async event=>{
    event.preventDefault();
    if(pick('password').value!==pick('confirm').value){pick('confirm').setCustomValidity('הסיסמאות אינן תואמות.');pick('confirm').reportValidity();return}
    const button=event.target.querySelector('button');button.disabled=true;status('שומר סיסמה…');
    try{const result=await request('/api/auth/reset-password',{token,password:pick('password').value});token='';event.target.reset();event.target.classList.add('hidden');status(result.message)}
    catch(error){if(error.status===400)linkError();else status(error.status?error.message:'לא ניתן להתחבר לשרת. נסו שוב.',true)}
    finally{button.disabled=false}
  });
})();
</script>
</body>
</html>
